name: TestFlight

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional build number; leave empty to use 1000 + the workflow run number"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: Build and upload to TestFlight
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    environment: production
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Check App Store secrets
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=0
          for name in CERT_BASE64 CERT_PASSWORD PROFILE_BASE64 API_KEY API_KEY_ID API_ISSUER TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Read version and choose build number
        env:
          REQUESTED_BUILD: ${{ inputs.build_number }}
        run: |
          VERSION=$(awk '/^version:/ {print $2}' app/pubspec.yaml | cut -d+ -f1)
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Unexpected pubspec version: $VERSION" >&2; exit 1 ;;
          esac
          if [ -n "$REQUESTED_BUILD" ]; then
            case "$REQUESTED_BUILD" in
              *[!0-9]*) echo "build_number must be numeric" >&2; exit 1 ;;
            esac
            BUILD="$REQUESTED_BUILD"
          else
            BUILD=$((1000 + GITHUB_RUN_NUMBER))
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "TestFlight build: $VERSION ($BUILD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Import signing material
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          umask 077
          CERT_PASSWORD=$(printf '%s' "$CERT_PASSWORD" | tr -d '\r\n')
          TEAM_ID=$(printf '%s' "$TEAM_ID" | tr -d '\r\n')
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"

          printf '%s' "$CERT_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/cert.p12"
          if ! security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign; then
            echo "Re-encoding the PKCS#12 for the macOS Security framework."
            openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:CERT_PASSWORD -nodes -out "$RUNNER_TEMP/cert.pem"
            openssl pkcs12 -export -legacy -in "$RUNNER_TEMP/cert.pem" -inkey "$RUNNER_TEMP/cert.pem" -passout env:CERT_PASSWORD -out "$RUNNER_TEMP/cert-mac.p12"
            security import "$RUNNER_TEMP/cert-mac.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert-mac.p12"
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_PATH="$PROFILE_DIR/whotook.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | tr -d '\r\n' | base64 -d > "$PROFILE_PATH"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          openssl cms -verify -noverify -inform DER -in "$PROFILE_PATH" -out "$PROFILE_PLIST"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

          cat > app/ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build signed IPA
        working-directory: app
        env:
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
          FLUTTER_XCODE_CODE_SIGN_STYLE: Automatic
        run: |
          flutter build ipa --release \
              --build-number "$BUILD" \
              --export-options-plist=ios/ExportOptions.plist

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          API_KEY_ID=$(printf '%s' "$API_KEY_ID" | tr -d '\r\n')
          API_ISSUER=$(printf '%s' "$API_ISSUER" | tr -d '\r\n')
          IPA=$(find app/build/ios/ipa -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then
            echo "No IPA found" >&2
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER" \
            --show-progress
          {
            echo "### TestFlight upload complete"
            echo ""
            echo "- Version: **$VERSION**"
            echo "- Build: **$BUILD**"
            echo "- Open App Store Connect > TestFlight to wait for processing."
            echo "- Internal testers need an App Store Connect user account."
          } >> "$GITHUB_STEP_SUMMARY"
