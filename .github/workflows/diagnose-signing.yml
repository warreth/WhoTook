name: Diagnose signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    environment: production
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Inspect the certificate without printing secrets
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$CERT_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/cert.p12"
          echo "p12 bytes: $(wc -c < "$RUNNER_TEMP/cert.p12")"
          openssl version
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:CERT_PASSWORD -info -noout 2>&1 | sed -n '1,12p'
          KEYCHAIN="$RUNNER_TEMP/diag.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          set +e
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign 2>&1 | tail -3
          echo "import_exit=$?"
          printf '%s' "$PROFILE_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          echo "profile bytes: $(wc -c < "$RUNNER_TEMP/profile.mobileprovision")"
          file "$RUNNER_TEMP/profile.mobileprovision"
          xxd -l 16 "$RUNNER_TEMP/profile.mobileprovision"
          set +e
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" 2>&1 | head -3
          echo "profile_parse_exit=$?"
