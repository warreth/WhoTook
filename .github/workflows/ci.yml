name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-server-code:
    name: Public tree has no server code
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Refuse server code in the public repository
        run: |
          for path in cloudflare-signaling store prototypes app/tool docs/PRODUCTION.md wrangler.jsonc wrangler.json wrangler.toml .dev.vars.example; do
            if [ -e "$path" ]; then
              echo "Private server, release or store material found in the public tree: $path" >&2
              exit 1
            fi
          done
          # The public playtest harness is allowed under tool/playtest only.
          if [ -d tool ] && find tool -mindepth 1 -maxdepth 1 ! -name playtest -print -quit | grep -q .; then
            echo "Unexpected tooling found in the public tree: tool" >&2
            exit 1
          fi
          echo "Public tree has no server, release or store material."

  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64

  ios:
    name: iOS build without signing
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Build iOS without codesign
        working-directory: app
        run: flutter build ios --debug --no-codesign
