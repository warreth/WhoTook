name: TestFlight status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read the latest App Store Connect state
        env:
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import json, os, time, urllib.request
          import jwt

          key = os.environ['API_KEY']
          token = jwt.encode(
              {
                  'iss': os.environ['API_ISSUER'],
                  'iat': int(time.time()),
                  'exp': int(time.time()) + 900,
                  'aud': 'appstoreconnect-v1',
              },
              key,
              algorithm='ES256',
              headers={'kid': os.environ['API_KEY_ID']},
          )

          def get(path):
              request = urllib.request.Request(
                  'https://api.appstoreconnect.apple.com/v1' + path,
                  headers={'Authorization': f'Bearer {token}'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          apps = get('/apps?filter[bundleId]=party.whotook.app&limit=1')['data']
          if not apps:
              print('No App Store Connect app for party.whotook.app')
              raise SystemExit(1)
          app_id = apps[0]['id']
          print('app:', apps[0]['attributes']['name'], app_id)
          builds = get(f'/builds?filter[app]={app_id}&sort=-uploadedDate&limit=5')['data']
          for build in builds:
              print('build:', build['attributes'].get('version'), build['attributes'].get('processingState'), build['attributes'].get('uploadedDate'))
          groups = get(f'/betaGroups?filter[app]={app_id}&limit=20')['data']
          for group in groups:
              print('group:', group['attributes'].get('name'), 'internal=', group['attributes'].get('isInternalGroup'))
          PY
