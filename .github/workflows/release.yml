name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v1.0.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Check optional store secrets
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      play: ${{ steps.check.outputs.play }}
      ios: ${{ steps.check.outputs.ios }}
    steps:
      - name: Check secrets
        id: check
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          IOS_CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_CERT_PASS: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          IOS_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          IOS_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          IOS_TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "play=true" >> "$GITHUB_OUTPUT"
          else
            echo "play=false" >> "$GITHUB_OUTPUT"
            echo "No Play service account. The Play upload will be skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$IOS_CERT" ] && [ -n "$IOS_CERT_PASS" ] && [ -n "$IOS_PROFILE" ] && [ -n "$IOS_API_KEY" ] && [ -n "$IOS_KEY_ID" ] && [ -n "$IOS_ISSUER" ] && [ -n "$IOS_TEAM" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
            echo "No iOS distribution certificate, profile or API key. The App Store upload will be skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  android:
    name: Signed APK and AAB
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.signing.outputs.present }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Read version
        id: version
        run: |
          VERSION=$(awk '/^version:/ {print $2}' app/pubspec.yaml | cut -d+ -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building WhoTook $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Write signing config
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No keystore secret. A release must be signed; refusing to publish a debug-signed APK." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          umask 077
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload-keystore.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > app/android/key.properties
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build release APK, split APKs and AAB
        working-directory: app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.present }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          flutter build apk --release
          # Copy the universal APK before the split build replaces the shared
          # flutter-apk outputs. Keep the stable alias for the website and
          # Obtainium, plus a versioned name for the release page.
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/WhoTook.apk
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/WhoTook-${VERSION}-universal.apk"

          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../dist/WhoTook-${VERSION}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "../dist/WhoTook-${VERSION}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "../dist/WhoTook-${VERSION}-x86_64.apk"

          if [ "${SIGNED}" = "true" ]; then
            flutter build appbundle --release
            cp build/app/outputs/bundle/release/app-release.aab "../dist/WhoTook-${VERSION}.aab"
          fi

      - name: Collect artifacts
        run: |
          cd dist
          sha256sum *.apk *.aab 2>/dev/null > SHA256SUMS.txt || true
          ls -lh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  ios-unsigned:
    name: Unsigned IPA for SideStore
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build unsigned iOS app
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          VERSION=$(awk '/^version:/ {print $2}' app/pubspec.yaml | cut -d+ -f1)
          mkdir -p dist/Payload
          cp -R app/build/ios/iphoneos/Runner.app dist/Payload/
          cd dist
          zip -qry "WhoTook-${VERSION}-unsigned.ipa" Payload
          cp "WhoTook-${VERSION}-unsigned.ipa" WhoTook-unsigned.ipa
          rm -rf Payload
          sha256sum *.ipa > SHA256SUMS-ios.txt
          ls -lh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-unsigned
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [android, ios-unsigned]
    if: github.event_name == 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    environment: production
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-unsigned
          path: dist

      - name: Rebuild checksums
        run: |
          rm -f dist/SHA256SUMS-ios.txt
          cd dist
          sha256sum *.apk *.aab *.ipa > SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag must look like v1.2.3" >&2; exit 1 ;;
          esac
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Tag $TAG does not match pubspec version $VERSION" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" \
              --title "WhoTook $VERSION" \
              --notes-file .github/release-notes.md
          else
            gh release create "$TAG" dist/* \
              --title "WhoTook $VERSION" \
              --notes-file .github/release-notes.md \
              --latest
          fi

  play:
    name: Google Play (optional)
    needs: [gate, android]
    if: needs.gate.outputs.play == 'true' && needs.android.outputs.signed == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android
          path: dist

      - uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: party.whotook.app
          releaseFiles: dist/WhoTook-${{ needs.android.outputs.version }}.aab
          track: internal
          status: draft
          releaseName: ${{ needs.android.outputs.version }}

  ios:
    name: Build and upload a signed IPA (optional)
    needs: gate
    if: needs.gate.outputs.ios == 'true'
    environment: production
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Import signing material
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"

          echo "$CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_PATH="$PROFILE_DIR/whotook.mobileprovision"
          echo "$PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin)
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

          cat > app/ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>party.whotook.app</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build signed IPA
        working-directory: app
        env:
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
        run: |
          FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$(find app/build/ios/ipa -name '*.ipa' | head -1)" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER" \
            --show-progress

      # The App Store build is signed for Apple's distribution service. Do not
      # publish it as a public release asset: SideStore and AltStore install the
      # unsigned IPA and re-sign it on the device.
      - name: Keep the signed IPA as a private CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-signed
          path: app/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
