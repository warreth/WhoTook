name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Check optional store secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      play: ${{ steps.check.outputs.play }}
      ios: ${{ steps.check.outputs.ios }}
    steps:
      - name: Check secrets
        id: check
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          IOS_CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_CERT_PASS: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          IOS_TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "play=true" >> "$GITHUB_OUTPUT"
          else
            echo "play=false" >> "$GITHUB_OUTPUT"
            echo "No Play service account. The Play upload will be skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$IOS_CERT" ] && [ -n "$IOS_CERT_PASS" ] && [ -n "$IOS_PROFILE" ] && [ -n "$IOS_API_KEY" ] && [ -n "$IOS_TEAM" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
            echo "No iOS distribution certificate, profile or API key. The App Store upload will be skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  android:
    name: Signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.signing.outputs.present }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Read version
        id: version
        run: |
          VERSION=$(awk '/^version:/ {print $2}' app/pubspec.yaml | cut -d+ -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building WhoTook $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Write signing config
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No keystore secret. The APK will be unsigned and is not installable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat > app/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Build release AAB
        if: steps.signing.outputs.present == 'true'
        working-directory: app
        run: flutter build appbundle --release

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/WhoTook-${{ steps.version.outputs.version }}.apk"
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/WhoTook.apk"
          if [ -f app/build/app/outputs/bundle/release/app-release.aab ]; then
            cp app/build/app/outputs/bundle/release/app-release.aab "dist/WhoTook-${{ steps.version.outputs.version }}.aab"
          fi
          sha256sum dist/* > dist/SHA256SUMS.txt
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "WhoTook $VERSION" \
              --notes-file .github/release-notes.md \
              --latest
          fi

  play:
    name: Google Play (optional)
    needs: [gate, android]
    if: needs.gate.outputs.play == 'true' && needs.android.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist

      - uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.whotook.whotook
          releaseFiles: dist/WhoTook-${{ needs.android.outputs.version }}.aab
          track: internal
          status: draft
          releaseName: ${{ needs.android.outputs.version }}

  ios:
    name: App Store (optional)
    needs: gate
    if: needs.gate.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Import signing material
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"

          echo "$CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_PATH="$PROFILE_DIR/whotook.mobileprovision"
          echo "$PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin)
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

          cat > app/ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.whotook.whotook</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build signed IPA
        working-directory: app
        env:
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
        run: |
          FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$(find app/build/ios/ipa -name '*.ipa' | head -1)" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER" \
            --show-progress
