name: whotook
description: "Open-source hybrid LAN & WebRTC party photo-guessing game."
publish_to: 'none'
version: 1.4.0+8

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  app_links: ^7.2.2
  bonsoir: ^7.1.6
  crypto: ^3.0.6
  flutter_image_compress: ^2.5.1
  flutter_riverpod: ^3.5.0
  flutter_webrtc: ^1.6.3
  http: ^1.3.0
  mobile_scanner: ^7.5.0
  photo_manager: ^3.12.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2
  web_socket_channel: ^3.0.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/samples/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
